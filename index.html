<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你好，Cloudflare Pages</title>
<meta name="description" content="一个通过 Git 集成自动部署到 Cloudflare Pages 的静态页面。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%B3%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg-1: #0b1020;
    --bg-2: #131b33;
    --ink: #eef2ff;
    --muted: #9aa6c4;
    --accent: #f6821f;
    --accent-2: #4b8bff;
    --card: rgba(255, 255, 255, 0.045);
    --line: rgba(255, 255, 255, 0.10);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: radial-gradient(1200px 600px at 15% -10%, #1d2a52 0%, transparent 55%),
                radial-gradient(900px 500px at 90% 110%, #2a1a3d 0%, transparent 55%),
                linear-gradient(160deg, var(--bg-1), var(--bg-2));
    background-attachment: fixed;
    display: grid;
    place-items: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: min(680px, 100%);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 44px 40px 36px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.75);
    animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px) scale(0.985); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #b9ffcf;
    background: rgba(52, 211, 153, 0.10);
    border: 1px solid rgba(52, 211, 153, 0.28);
    padding: 6px 12px;
    border-radius: 999px;
    margin-bottom: 26px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7);
    animation: pulse 2.2s infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.65); }
    70%  { box-shadow: 0 0 0 10px rgba(52, 211, 153, 0); }
    100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
  }

  h1 {
    margin: 0 0 14px;
    font-size: clamp(28px, 5vw, 40px);
    line-height: 1.18;
    letter-spacing: -0.02em;
    font-weight: 700;
  }

  h1 .grad {
    background: linear-gradient(100deg, var(--accent) 0%, #ffb347 45%, var(--accent-2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p.lead {
    margin: 0 0 28px;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.75;
  }

  p.lead code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.92em;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid var(--line);
    padding: 1px 6px;
    border-radius: 5px;
    color: #cfe0ff;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 32px;
    padding: 0;
    list-style: none;
  }

  .tags li {
    font-size: 13px;
    color: #c7d2fe;
    background: rgba(99, 102, 241, 0.12);
    border: 1px solid rgba(99, 102, 241, 0.26);
    padding: 7px 13px;
    border-radius: 9px;
    transition: transform 0.18s ease, background 0.18s ease;
  }

  .tags li:hover {
    transform: translateY(-2px);
    background: rgba(99, 102, 241, 0.2);
  }

  .next {
    border-top: 1px solid var(--line);
    padding-top: 24px;
  }

  .next h2 {
    margin: 0 0 12px;
    font-size: 14px;
    color: #cfd8ee;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .next ol {
    margin: 0;
    padding-left: 20px;
    color: var(--muted);
    font-size: 14.5px;
    line-height: 2;
  }

  .next ol code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: rgba(255, 255, 255, 0.07);
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 0.9em;
    color: #ffe0b3;
  }

  footer {
    margin-top: 26px;
    font-size: 12.5px;
    color: #6f7b96;
    text-align: center;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="badge"><span class="dot"></span>已部署 · Deployed</div>

    <h1>你好，<span class="grad">Cloudflare Pages</span></h1>

    <p class="lead">
      这个页面是通过 <code>git push</code> 自动构建并发布到 Cloudflare 全球网络的。
      不花钱，自带 HTTPS，改完推上去就生效。
    </p>

    <ul class="tags">
      <li>纯静态</li>
      <li>免费额度</li>
      <li>自动 HTTPS</li>
      <li>全球 CDN</li>
      <li>Git 触发构建</li>
    </ul>

    <div class="next">
      <h2>接下来做什么</h2>
      <ol>
        <li>把这个 <code>index.html</code> 换成你自己的内容</li>
        <li><code>git add -A</code> 并 <code>git commit -m "更新内容"</code></li>
        <li><code>git push</code>，一分钟后线上自动更新</li>
      </ol>
    </div>

    <footer>Cloudflare Pages · 静态站点由 Git 驱动</footer>
  </main>
</body>
</html>
